services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-pay-postgres
    environment:
      POSTGRES_DB: wallet_pay
      POSTGRES_USER: wallet_pay
      POSTGRES_PASSWORD: wallet_pay
    ports:
      - "5432:5432"
    volumes:
      - wallet_pay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_pay -d wallet_pay"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wallet-pay-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: wallet-pay-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wallet_pay_postgres_data:
