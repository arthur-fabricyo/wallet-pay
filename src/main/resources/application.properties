spring.application.name=Wallet-pay

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet_pay}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wallet_pay}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wallet_pay}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.do_not_audit_optimistic_locking_field=false

spring.flyway.enabled=true

wallet-pay.integrations.cnpj-ws.base-url=${CNPJ_WS_BASE_URL:https://publica.cnpj.ws}
wallet-pay.auth.jwt-secret=${JWT_SECRET:wallet-pay-local-development-secret-32b}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.pattern.correlation=[%X{requestId:-}] 

walletpay.limits.timezone=America/Sao_Paulo
walletpay.limits.night.start=20:00
walletpay.limits.night.end=06:00

walletpay.limits.transfer.per-operation=5000.00
walletpay.limits.transfer.daily=10000.00
walletpay.limits.transfer.monthly=50000.00
walletpay.limits.transfer.night-per-operation=1000.00
walletpay.limits.transfer.night-window=1000.00

walletpay.limits.deposit.per-operation=10000.00
walletpay.limits.deposit.daily=20000.00
